spring:
  datasource:
    url: jdbc:h2:mem:webhookdlq;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}
    consumer:
      group-id: webhook-test-processor-group
      auto-offset-reset: earliest
      enable-auto-commit: false

webhook:
  kafka:
    dlq-topic: webhook-events.DLT
    retry:
      max-attempts: 1
      backoff-interval-ms: 0