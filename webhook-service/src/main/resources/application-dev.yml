spring:
  datasource:
    url: jdbc:h2:mem:webhookdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

spring.kafka.bootstrap-servers: localhost:9092