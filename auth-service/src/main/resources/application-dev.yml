spring:
  datasource:
    url: jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1;MODE=POSTGRESQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081  # ✅ AUTH-SERVICE PORT

jwt:
  secret: 07e7d120437153c0a2b2f9578d7cce771a0ac48315388e76d868c68e5be36c7f
  expiration: 86400000 # 24 hours

logging:
  level:
    com.pay.auth: DEBUG