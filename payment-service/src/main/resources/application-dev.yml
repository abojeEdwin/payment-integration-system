spring:
  datasource:
    url: jdbc:h2:mem:paymentdb;DB_CLOSE_DELAY=-1;MODE=POSTGRESQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8082  # ✅ PAYMENT-SERVICE PORT

providers:
  paystack:
    secret-key: ${PAYSTACK_SECRET_KEY:sk_test_xxx}
    api-url: https://api.paystack.co
  interswitch:
    secret-key: ${INTERSWITCH_SECRET_KEY:sk_test_xxx}
    api-url: https://newwebpay.qa.interswitchng.com
  squadco:
    secret-key: ${SQUADCO_SECRET_KEY:sk_test_xxx}
    api-url: https://sandbox-api-d.squadco.com

webhook:
  service:
    url: ${WEBHOOK_SERVICE_URL:http://localhost:8083/webhooks}
auth:
  service:
    url: ${AUTH_SERVICE_URL:http://localhost:8081}

logging:
  level:
    com.pay.payment: DEBUG
    org.springframework.kafka: INFO