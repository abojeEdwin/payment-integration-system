name: paybridge-dev

networks:
  paybridge-network:
    driver: bridge

volumes:
  postgres-data:
  kafka-data:
  pgadmin-data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: paybridge-postgres
    restart: unless-stopped
    networks:
      - paybridge-network
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-dev_password_123}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 8

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: paybridge-kafka
    restart: unless-stopped
    networks:
      - paybridge-network
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 8

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: paybridge-kafka-ui
    restart: unless-stopped
    networks:
      - paybridge-network
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: paybridge-dev
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: paybridge-pgadmin
    restart: unless-stopped
    networks:
      - paybridge-network
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@paybridge.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  auth-service:
    build:
      context: .
      dockerfile: auth-service/src/main/docker/Dockerfile
    container_name: paybridge-auth-service
    restart: unless-stopped
    networks:
      - paybridge-network
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      AUTH_DB_URL: jdbc:postgresql://postgres:5432/auth_db
      AUTH_DB_USERNAME: auth_user
      AUTH_DB_PASSWORD: ${APP_DB_PASSWORD:-dev_password_123}
      JWT_SECRET: ${JWT_SECRET:-07e7d120437153c0a2b2f9578d7cce771a0ac48315388e76d868c68e5be36c7f}
    depends_on:
      postgres:
        condition: service_healthy

  payment-service:
    build:
      context: .
      dockerfile: payment-service/src/main/docker/Dockerfile
    container_name: paybridge-payment-service
    restart: unless-stopped
    networks:
      - paybridge-network
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      PAYMENT_DB_URL: jdbc:postgresql://postgres:5432/payment_db
      PAYMENT_DB_USERNAME: payment_user
      PAYMENT_DB_PASSWORD: ${APP_DB_PASSWORD:-dev_password_123}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      AUTH_SERVICE_URL: http://auth-service:8081
      WEBHOOK_SERVICE_URL: http://webhook-service:8083/webhooks
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-sk_test_DEFAULT}
      INTERSWITCH_SECRET_KEY: ${INTERSWITCH_SECRET_KEY:-sk_test_xxx}
      SQUADCO_SECRET_KEY: ${SQUADCO_SECRET_KEY:-sandbox_sk_default}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      auth-service:
        condition: service_started

  webhook-service:
    build:
      context: .
      dockerfile: webhook-service/src/main/docker/Dockerfile
    container_name: paybridge-webhook-service
    restart: unless-stopped
    networks:
      - paybridge-network
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      WEBHOOK_DB_URL: jdbc:postgresql://postgres:5432/webhook_db
      WEBHOOK_DB_USERNAME: webhook_user
      WEBHOOK_DB_PASSWORD: ${APP_DB_PASSWORD:-dev_password_123}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PAYMENT_SERVICE_URL: http://payment-service:8082
      PAYSTACK_WEBHOOK_SECRET: ${PAYSTACK_WEBHOOK_SECRET:-}
      INTERSWITCH_WEBHOOK_SECRET: ${INTERSWITCH_WEBHOOK_SECRET:-}
      SQUADCO_WEBHOOK_SECRET: ${SQUADCO_WEBHOOK_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      payment-service:
        condition: service_started

