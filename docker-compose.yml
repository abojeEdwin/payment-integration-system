version: '3.8'

name: paybridge-dev

networks:
  paybridge-network:
    driver: bridge

services:
  # ===================================================================
  # POSTGRESQL DATABASE
  # ===================================================================
  postgres:
    image: postgres:16-alpine
    container_name: paybridge-postgres
    restart: unless-stopped
    networks:
      - paybridge-network
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password_123}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./docker/postgres/conf/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: >
      postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_user -d payment_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===================================================================
  # KAFKA (with Zookeeper)
  # ===================================================================
  zookeeper:
    image: bitnami/zookeeper:3.9
    container_name: paybridge-zookeeper
    restart: unless-stopped
    networks:
      - paybridge-network
    ports:
      - "2181:2181"
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    healthcheck:
      test: ["CMD", "zkOk.sh"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  kafka:
    image: bitnami/kafka:3.8
    container_name: paybridge-kafka
    restart: unless-stopped
    networks:
      - paybridge-network
    ports:
      - "9092:9092"
      - "9093:9093"  # For internal communication
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CFG_LOG_RETENTION_HOURS: 168  # 7 days
      KAFKA_CFG_LOG_SEGMENT_BYTES: 1073741824  # 1GB
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_HEAP_OPTS: "-Xmx1G -Xms1G"
    depends_on:
      zookeeper:
        condition: service_healthy
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ===================================================================
  # HASHICORP VAULT (Dev Mode)
  # ===================================================================
  vault:
    image: hashicorp/vault:1.16
    container_name: paybridge-vault
    restart: unless-stopped
    networks:
      - paybridge-network
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: http://0.0.0.0:8200
      VAULT_API_ADDR: http://vault:8200
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN:-dev-only-token-123}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_DEV_UNSEAL_KEY_FILE: /vault/file/unseal-key
    volumes:
      - vault-data:/vault/file
      - ./docker/vault/config:/vault/config:ro
      - ./docker/vault/policies:/vault/policies:ro
      - ./docker/vault/scripts:/vault/scripts:ro
    command: >
      sh -c "
      vault server -dev -dev-root-token-id=$$VAULT_DEV_ROOT_TOKEN_ID &
      sleep 2 &&
      /vault/scripts/init-vault.sh &&
      tail -f /dev/null
      "
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://localhost:8200"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===================================================================
  # KAFKA UI (Optional - for monitoring)
  # ===================================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: paybridge-kafka-ui
    restart: unless-stopped
    networks:
      - paybridge-network
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: paybridge-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      KAFKA_CLUSTERS_0_JMXPORT: 9997
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===================================================================
  # PGADMIN (Optional - for database management)
  # ===================================================================
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: paybridge-pgadmin
    restart: unless-stopped
    networks:
      - paybridge-network
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@paybridge.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
    driver: local
  kafka-data:
    driver: local
  vault-data:
    driver: local
  pgadmin-data:
    driver: local

# ===================================================================
# BUILD ARGUMENTS (for local overrides)
# ===================================================================
x-environment:
  POSTGRES_PASSWORD: "dev_password_123"
  VAULT_DEV_ROOT_TOKEN: "dev-only-token-123"
  PGADMIN_DEFAULT_EMAIL: "admin@paybridge.local"
  PGADMIN_DEFAULT_PASSWORD: "admin123"